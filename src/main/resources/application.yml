spring:
  application:
    name: order-support-assistant

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ordersupport}
    username: ${SPRING_DATASOURCE_USERNAME:ordersupport}
    password: ${SPRING_DATASOURCE_PASSWORD:ordersupport}
    hikari:
      maximum-pool-size: 10

  flyway:
    enabled: true
    # Production runs migrations only. Demo fixtures live in db/seed and are added
    # to this list by the local and test profiles.
    locations: classpath:db/migration

  ai:
    openai:
      # Only needed for the chat model. Retrieval runs offline; see app.ai.mode.
      api-key: ${OPENAI_API_KEY:missing-openai-api-key}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.2
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      pgvector:
        # The table is created and versioned by Flyway (V2__vector_store.sql), not
        # by the library, so schema changes go through review like any other DDL.
        initialize-schema: false
        table-name: vector_store
        dimensions: 1536
        index-type: HNSW
        distance-type: COSINE_DISTANCE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

app:
  ai:
    # `openai` for hosted embeddings, `offline` for the deterministic local model.
    mode: ${APP_AI_MODE:openai}
  rag:
    top-k: 4
    # Cut-offs differ per embedding model; see PolicyRetriever for the measurements.
    similarity-threshold: 0.35
    offline-similarity-threshold: 0.20
    ingest-on-startup: true
    max-chunk-chars: 1200
    chunk-overlap-chars: 150
  agent:
    confirmation-ttl: PT10M
    max-history-messages: 12
  guardrail:
    scope-check-enabled: true
    injection-check-enabled: true

logging:
  level:
    com.acme.ordersupport: INFO

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/seed

app:
  ai:
    mode: ${APP_AI_MODE:offline}

logging:
  level:
    com.acme.ordersupport: DEBUG

---
# Fully local: chat from Ollama, embeddings from the deterministic local model, no
# API key and no outbound network anywhere in the stack.
#
#   ollama serve && ollama pull qwen2.5:7b
#   make run-ollama
#
# qwen2.5:7b was chosen by measurement, not reputation -- scripts/probe-ollama-model.py
# checks the three things this project actually needs from a model, and the results are
# in the README. The short version: a model that merely lists "tools" as a capability is
# not enough. mistral:7b advertises tool support and never emits a tool call; it narrates
# calling the function instead, so the agent chats pleasantly and never touches an order.
spring:
  config:
    activate:
      on-profile: ollama
  ai:
    model:
      # Selects Ollama over OpenAI for chat. Both starters are on the classpath, so
      # switching providers is this one property and no code change.
      chat: ollama
      # Embeddings stay local. Ollama's embedding models output 768 dimensions and the
      # vector_store column is vector(1536), so pointing embeddings at Ollama would need
      # a migration -- see the README before doing it.
      embedding: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        # The model is pulled deliberately, not implicitly on first request: a silent
        # 4.7 GB download inside a health check is a bad surprise.
        pull-model-strategy: never
      chat:
        options:
          model: "${OLLAMA_CHAT_MODEL:qwen2.5:7b}"
          temperature: 0.2

app:
  ai:
    mode: offline
